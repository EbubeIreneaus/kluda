server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}
    basic_auth:
      username: "${LOKI_USERNAME}"
      password: "${LOKI_PASSWORD}"

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            tag: attrs.tag
      - regex:
          expression: "^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*-json.log$"
          source: filename
      - timestamp:
          format: RFC3339Nano
          source: time
      - output:
          source: log
