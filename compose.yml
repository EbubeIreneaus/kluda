services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - app
      - api
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ./api/.env
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/kluda
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: arq worker.config.WorkerSettings
    env_file:
      - ./api/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgresql+asyncpg://postgres:postgres@db:5432/kluda
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kluda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

volumes:
  postgres_data:
