name: CI – Build & E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ────────────────────────────────────────────────
  # 1. Web (Nuxt SSR) – build check
  # ────────────────────────────────────────────────
  build-web:
    name: Build Web (Nuxt SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install

      - name: Build (nuxt build)
        working-directory: ./web
        env:
          NUXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NUXT_PUBLIC_POS_URL: http://localhost:3000
        run: pnpm run build

  # ────────────────────────────────────────────────
  # 2. Admin (Nuxt generate) – build check
  # ────────────────────────────────────────────────
  build-admin:
    name: Build Admin (Nuxt Generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./admin
        run: pnpm install

      - name: Build (nuxt generate)
        working-directory: ./admin
        env:
          NUXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: pnpm run build

  # ────────────────────────────────────────────────
  # 3. E2E – API + App + Playwright tests
  # ────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kluda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Node / pnpm ──────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      # ── Python / uv ──────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ── FastAPI backend ───────────────────────────
      - name: Install API dependencies
        working-directory: ./api
        run: uv sync

      - name: Start API server
        working-directory: ./api
        env:
          # Core – real values required
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kluda
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_1234567890abcdef
          APP_ENV: development
          COOKIE_SECURE: "False"
          DOMAIN_NAME: localhost
          # Email – guarded by hasattr/check in code before use; dummy is safe
          RESEND_API_KEY: re_dummy_key_not_used_in_e2e
          RESEND_SIGNING_SECRET: dummy_resend_signing_secret
          # Push notifications – guarded in worker; dummy keys are safe
          VAPID_PUBLIC_KEY: BDummyVapidPublicKeyForCITesting1234567890abcdef
          VAPID_PRIVATE_KEY: dummyVapidPrivateKeyForCITesting1234567890ab
          VAPID_CLAIM_EMAIL: ci@example.com
          # Media uploads – not triggered in E2E flows
          CLOUDINARY_NAME: dummy_cloud
          CLOUDINARY_KEY: "000000000000000"
          CLOUDINARY_SECRET: dummy_cloudinary_secret
          IMAGE_FOLDER: kluda
          # Payments – not triggered in E2E flows
          PAYSTACK_SECRET: sk_test_dummy_paystack_secret
          PAYSTACK_PUBLIC: pk_test_dummy_paystack_public
          # Super admin seed – used on startup init_db
          SUPER_STAFF_EMAIL: admin@example.com
          SUPER_STAFF_NAME: Admin
          SUPER_STAFF_PASSWORD: Admin@123456
          SUPER_ADMIN_NAME: Super Admin
          SUPER_ADMIN_EMAIL: superadmin@example.com
          SUPER_ADMIN_PASSWORD: SuperAdmin@123456
          SUPER_ADMIN_PHONE: "08000000000"
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for API to become ready..."
          timeout 45s bash -c 'until curl -sf http://localhost:8000/api/v1/auth/contact-info > /dev/null; do sleep 1; done'
          echo "API is up ✅"

      # ── Nuxt POS app (dev server for E2E) ────────
      - name: Install App dependencies
        working-directory: ./app
        run: pnpm install

      - name: Start App dev server
        working-directory: ./app
        env:
          NUXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          pnpm run dev &
          echo "Waiting for App dev server..."
          timeout 60s bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "App is up ✅"

      # ── Playwright ───────────────────────────────
      - name: Install Playwright browsers
        working-directory: ./app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: ./app
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          CI: "true"
        run: pnpm run test:e2e

      # ── Artifacts ────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          retention-days: 7
