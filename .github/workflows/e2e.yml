name: Playwright E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kluda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install API Dependencies & Start Backend
        working-directory: ./api
        env:
          DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/kluda
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e_test_secret_key_1234567890
          COOKIE_SECURE: "False"
        run: |
          uv sync
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for API server to become ready..."
          timeout 30s bash -c 'until curl -s http://localhost:8000/api/v1/auth/contact-info > /dev/null; do sleep 1; done'

      - name: Install App Dependencies
        working-directory: ./app
        run: pnpm install

      - name: Install Playwright Browsers with System Dependencies
        working-directory: ./app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: ./app
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          CI: "true"
        run: pnpm run test:e2e

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14
